<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#050505"/>
<stop offset="55%" stop-color="#111111"/>
<stop offset="100%" stop-color="#c49b1d"/>
</linearGradient>

<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#00e5ff00"/>
<stop offset="50%" stop-color="#00e5ff"/>
<stop offset="100%" stop-color="#00e5ff00"/>
</linearGradient>

<filter id="goldGlow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<filter id="cyanGlow">
<feGaussianBlur stdDeviation="10"/>
</filter>

</defs>

<rect width="1200" height="320" rx="25" fill="url(#bg)"/>

<!-- HUD Border -->

<rect
x="28"
y="28"
width="1144"
height="264"
rx="18"
fill="none"
stroke="#d4af37"
stroke-width="2"
opacity=".55"/>

<!-- Top Left -->

<text
x="70"
y="70"
font-size="18"
fill="#d4af37"
font-family="monospace">

CSE STUDENT // SYSTEM ONLINE

</text>

<!-- Status LED -->

<circle cx="1085" cy="72" r="7" fill="#00ff88">
<animate attributeName="opacity"
values="1;.3;1"
dur="1.3s"
repeatCount="indefinite"/>
</circle>

<!-- Name -->

<text
x="600"
y="135"
text-anchor="middle"
font-size="56"
font-family="Arial"
font-weight="700"
fill="white">

ABDUL AHAD QURESHI

</text>

<!-- Skills -->

<text
x="600"
y="185"
text-anchor="middle"
font-size="24"
font-family="monospace"
fill="#e3bb45">

JAVA • AI • REACT • EMBEDDED SYSTEMS • IoT

</text>

<!-- Subtitle -->

<text
x="600"
y="225"
text-anchor="middle"
font-size="18"
fill="white"
opacity=".92">

Computer Systems Engineering Student • Building Intelligent Software

</text>

<!-- Decorative Wave -->

<path
d="
M0 245
Q250 210 500 245
T1000 245
T1200 245
"
stroke="#d4af37"
stroke-width="3"
opacity=".25"
fill="none"/>

<!-- Scanner -->

<rect
x="-250"
y="0"
width="180"
height="320"
fill="url(#scan)"
filter="url(#cyanGlow)">

<animate
attributeName="x"
values="-250;1300"
dur="4s"
repeatCount="indefinite"/>

</rect>

<!-- HUD Corners -->

<path d="M28 70 V28 H70" stroke="#d4af37" stroke-width="3" fill="none"/>

<path d="M1172 70 V28 H1130" stroke="#d4af37" stroke-width="3" fill="none"/>

<path d="M28 250 V292 H70" stroke="#d4af37" stroke-width="3" fill="none"/>

<path d="M1172 250 V292 H1130" stroke="#d4af37" stroke-width="3" fill="none"/>

</svg>
